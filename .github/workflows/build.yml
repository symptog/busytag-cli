name: Build Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --group build

      - name: Build CLI binary
        run: uv run pyinstaller --clean --noconfirm busytag-cli.spec

      #- name: Build GUI binary
      #  run: uv run pyinstaller --clean --noconfirm busytag-gui.spec

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: busytag-cli-linux
          path: |
            busytag.desktop
            dist/busytag-cli
          # dist/busytag-gui
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*/*
          draft: false
          prerelease: false
          generate_release_notes: true